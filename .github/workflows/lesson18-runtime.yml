name: Lesson 18 container check

on:
  push:
    branches: [master]
    paths:
      - 'scripts/lesson18-runtime/**'
      - '.github/workflows/lesson18-runtime.yml'
  workflow_dispatch:

permissions: {}

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Extract the lesson files from the exact revision
        run: |
          git init --quiet
          git fetch --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${GITHUB_SHA}"
          git archive FETCH_HEAD scripts/lesson18-runtime | tar -x
      - name: Run launcher unit tests
        run: python3 -B -m unittest discover -s scripts/lesson18-runtime -v
      - name: Build lesson image on the Linux Docker engine
        run: |
          test "$(docker info --format '{{.OSType}}')" = linux
          docker build --pull -t zxl-lesson18-excerpt:local scripts/lesson18-runtime
          docker image inspect --format '{{.Id}}' zxl-lesson18-excerpt:local
      - name: Verify the real launcher and container cleanup
        run: python3 -B scripts/lesson18-runtime/check_docker.py
